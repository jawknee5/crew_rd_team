name: Package apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux
      - uses: actions/upload-artifact@v4
        with:
          name: crew-rd-linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: crew-rd-windows-x64
          path: release/*.exe
          if-no-files-found: error

  macos:
    name: macOS x64 + arm64
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac
      - uses: actions/upload-artifact@v4
        with:
          name: crew-rd-macos
          path: release/*.dmg
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is not set}"
            : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is not set}"
            : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is not set}"
            : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is not set}"
            KEYSTORE_PATH="${RUNNER_TEMP}/crew-rd-release.keystore"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            (cd android && ANDROID_KEYSTORE_PATH="${KEYSTORE_PATH}" ./gradlew assembleRelease --no-daemon)
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_FLAVOR=release" >> "$GITHUB_ENV"
          else
            (cd android && ./gradlew assembleDebug --no-daemon)
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_FLAVOR=debug" >> "$GITHUB_ENV"
          fi
      - name: Name the APK
        run: |
          mkdir -p release
          VERSION=$(node -p "require('./package.json').version")
          cp "$APK_PATH" "release/CrewRD-${VERSION}-android-universal-${APK_FLAVOR}.apk"
      - name: Verify release APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK="release/CrewRD-$(node -p "require('./package.json').version")-android-universal-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK is signed with the Android debug key"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crew-rd-android-apk
          path: release/*.apk
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-arm64, windows-x64, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Crew R&D ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
